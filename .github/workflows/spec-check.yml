name: Spec Check

# spec_updated from devhelmhq/mono. Regenerates types onto the standing
# spec-sync branch and enables auto-merge. The repository CI workflow is the
# gate. This job does not run the test suite and does not open a second pull
# request.

on:
  repository_dispatch:
    types: [spec_updated]

concurrency:
  group: spec-sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SPEC_SYNC_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Download latest OpenAPI spec from monorepo
        run: |
          gh api repos/devhelmhq/mono/contents/docs/openapi/monitoring-api.json \
            -H "Accept: application/vnd.github.raw+json" \
            > docs/openapi/monitoring-api.json
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_DISPATCH_TOKEN }}

      - name: Regenerate types from spec
        run: |
          npm ci
          npm run typegen

      - name: Commit spec-sync branch
        id: commit
        run: |
          if git diff --quiet src/lib/api.generated.ts docs/openapi/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B spec-sync
          git add src/lib/api.generated.ts docs/openapi/monitoring-api.json
          git commit -m "chore: update generated API types from latest spec"
          if git fetch origin spec-sync; then
            git push --force-with-lease=refs/heads/spec-sync:refs/remotes/origin/spec-sync origin HEAD:spec-sync
          else
            git push -u origin HEAD:spec-sync
          fi

      - name: Open or update the spec-sync pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SPEC_SYNC_TOKEN }}
        run: |
          existing="$(gh pr list --head spec-sync --base main --state open --json number --jq '.[0].number')"
          if [ -z "$existing" ]; then
            gh pr create \
              --head spec-sync \
              --base main \
              --title "chore: update generated API types" \
              --body "Standing spec sync. CI on this pull request is the gate. GitHub auto-merges it when the required checks pass."
            existing="$(gh pr list --head spec-sync --base main --state open --json number --jq '.[0].number')"
          fi
          if ! gh pr merge "$existing" --auto --squash; then
            enabled="$(gh pr view "$existing" --json autoMergeRequest --jq '.autoMergeRequest != null')"
            [ "$enabled" = "true" ]
          fi

      - name: Alert spec sync failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_DISPATCH_TOKEN }}
        run: |
          gh api repos/devhelmhq/mono/dispatches --method POST --input - <<EOF
          {
            "event_type": "spec_sync_failed",
            "client_payload": {
              "repo": "${{ github.repository }}",
              "workflow": "${{ github.workflow }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "detail": "Spec Check could not update the standing spec-sync pull request."
            }
          }
          EOF
